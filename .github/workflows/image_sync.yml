name: Docker Image Sync to GHCR

on:
  # Executa quando acionado manualmente
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Nome da imagem; sem registro = Docker Hub (ex: ethereum/client-go, quay.io/strimzi/kafka)'
        required: true
      image_tag:
        description: 'Tag da imagem (ex: release-1.10)'
        required: true
      force_resync:
        description: 'Forçar ressincronização mesmo se a imagem já existir'
        required: false
        type: boolean
        default: false
  
  # Executa diariamente às 2h da manhã
  schedule:
    - cron: '0 2 * * *'
  
  # Permite que seja acionado por outro workflow ou API
  repository_dispatch:
    types: [image_sync_requested]

permissions:
  contents: read
  packages: write

jobs:
  sync-image:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Determinar imagem a sincronizar
        env:
          # Inputs do workflow_dispatch, ou dados do repository_dispatch, ou a
          # imagem predefinida da execução agendada. Entram por env para não
          # serem interpolados no script.
          IMAGE_NAME: ${{ github.event.inputs.image_name || github.event.client_payload.image_name || 'ethereum/client-go' }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || github.event.client_payload.image_tag || 'release-1.10' }}
          FORCE_RESYNC: ${{ github.event.inputs.force_resync || github.event.client_payload.force_resync || 'false' }}
        run: |
          set -euo pipefail
          # Docker Hub mantém o caminho; outros registros entram no caminho do GHCR
          # (quay.io/strimzi/kafka → ghcr.io/italoag/mirror/quay.io/strimzi/kafka).
          RESOLVIDO="$(bash scripts/image-mirror.sh resolve "$IMAGE_NAME" "$IMAGE_TAG")"
          {
            echo "$RESOLVIDO"
            echo "ORIGINAL_IMAGE=${IMAGE_NAME}:${IMAGE_TAG}"
            echo "FORCE_RESYNC=${FORCE_RESYNC}"
          } >> "$GITHUB_ENV"
          
          # Log para depuração
          echo "$RESOLVIDO"
          echo "Forçar ressincronização: ${FORCE_RESYNC}"
      
      - name: Garantir skopeo
        run: command -v skopeo || { sudo apt-get update && sudo apt-get install -y skopeo; }
      
      # O skopeo lê as credenciais que o login-action grava em ~/.docker/config.json
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          logout: false
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}
      
      # Login no Docker Hub para evitar o rate limit de pulls anônimos
      - name: Login no Docker Hub
        if: startsWith(env.SOURCE_IMAGE, 'docker.io/')
        uses: docker/login-action@v3
        with:
          logout: false
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Verificar se a imagem existe no GHCR
        run: |
          if skopeo inspect --raw "docker://${GHCR_IMAGE}" > /dev/null 2>&1; then
            if [[ "$FORCE_RESYNC" == "true" ]]; then
              echo "Imagem encontrada no GHCR, mas será ressincronizada devido à flag de força"
              echo "SINCRONIZAR=true" >> "$GITHUB_ENV"
            else
              echo "Imagem encontrada no GHCR e ressincronização não forçada"
              echo "SINCRONIZAR=false" >> "$GITHUB_ENV"
            fi
          else
            echo "Imagem não encontrada no GHCR: ${GHCR_IMAGE}"
            echo "SINCRONIZAR=true" >> "$GITHUB_ENV"
          fi
      
      - name: Verificar imagem na origem e analisar plataformas
        if: env.SINCRONIZAR == 'true'
        run: |
          set -euo pipefail
          if ! MANIFEST="$(skopeo inspect --raw "docker://${SOURCE_IMAGE}")"; then
            echo "Imagem não encontrada na origem: ${SOURCE_IMAGE}"
            exit 1
          fi
          echo "Imagem encontrada na origem: ${SOURCE_IMAGE}"
          
          # Verificar se é um manifesto de lista (multi-arquitetura)
          if echo "$MANIFEST" | jq -e '.manifests' > /dev/null; then
            echo "A imagem é multi-arquitetura. Plataformas disponíveis:"
            echo "$MANIFEST" | jq -r '.manifests[] | select(.platform) | "- \(.platform.os)/\(.platform.architecture)\(.platform.variant // "")"'
            ARQUITETURAS="$(echo "$MANIFEST" | jq -r '[.manifests[].platform.architecture // empty] | join(" ")')"
          else
            ARQUITETURAS="$(skopeo inspect --format '{{.Architecture}}' "docker://${SOURCE_IMAGE}")"
            echo "A imagem tem apenas uma arquitetura: ${ARQUITETURAS}"
          fi
          
          if [[ " ${ARQUITETURAS} " == *" arm64 "* ]]; then
            echo "ARM64 está disponível para esta imagem"
            echo "ARM64_DISPONIVEL=true" >> "$GITHUB_ENV"
          else
            echo "ARM64 NÃO está disponível para esta imagem"
            echo "ARM64_DISPONIVEL=false" >> "$GITHUB_ENV"
          fi
      
      - name: Sincronizar imagem multi-arquitetura para o GHCR
        if: env.SINCRONIZAR == 'true'
        run: |
          set -euo pipefail
          echo "Copiando ${SOURCE_IMAGE} → ${GHCR_IMAGE} (todas as arquiteturas)"
          # skopeo copia o índice e todos os manifests, sem passar pelo daemon
          skopeo copy --all --retry-times 3 "docker://${SOURCE_IMAGE}" "docker://${GHCR_IMAGE}"
          
          echo "Inspecionando o manifesto da imagem sincronizada:"
          skopeo inspect --raw "docker://${GHCR_IMAGE}" | jq .
      
      - name: Resultado da verificação
        run: |
          if [[ "$SINCRONIZAR" != "true" ]]; then
            echo "A imagem já existe no GHCR, nenhuma ação necessária."
          else
            echo "Imagem sincronizada com sucesso: ${SOURCE_IMAGE} → ${GHCR_IMAGE}"
            
            if [[ "${ARM64_DISPONIVEL:-false}" == "true" ]]; then
              echo "A imagem inclui suporte para ARM64 (Apple Silicon)."
            else
              echo "ATENÇÃO: A imagem original NÃO tem suporte para ARM64 (Apple Silicon)."
            fi
            
            if [[ "$FORCE_RESYNC" == "true" ]]; then
              echo "A ressincronização forçada foi concluída."
            fi
          fi
          
          {
            echo "### \`${ORIGINAL_IMAGE}\`"
            echo
            echo "Espelho: \`${GHCR_IMAGE}\`. Para usar com o nome original:"
            echo
            echo '```bash'
            echo "docker pull ${GHCR_IMAGE} && docker tag ${GHCR_IMAGE} ${ORIGINAL_IMAGE}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
